<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desvio</title><link rel="icon" href="falkyria.svg"><link rel="stylesheet" href="style.css"><script src="icons.js"></script></head><body>
<header><a class="back" href="index.html"><i data-ic="voltar"></i><span>Jogos</span></a><h1><i data-ic="desvio"></i> Desvio</h1><a class="brand" href="index.html" title="Falkyria Games"><img src="falkyria.svg" alt="Falkyria"></a></header><main>
<div class="bar"><span class="stat">Tempo <b id="sc">0,0</b> s</span><span class="stat">Recorde <b id="hi">0,0</b> s</span><span class="stat">Escudo <b id="sh">—</b></span><button id="new" class="primary">Novo jogo</button></div>
<canvas id="c" width="400" height="500"></canvas>
<div class="msg" id="msg"></div>
<p class="hint">Arraste o dedo ou mova o mouse para pilotar; no teclado use ← → ou A/D. Desvie dos meteoros e pegue o anel azul para ganhar um escudo.</p>
</main><script>
const $=i=>document.getElementById(i),cv=$('c'),x=cv.getContext('2d'),W=400,H=500,SY=H-46,TAU=Math.PI*2;
let st='idle',sx=W/2,tx=null,keys={},mets=[],pick=null,shield=false,t=0,nextM=0,nextP=0,hi=0,last=0,deadAt=-1e9,flash=0,drag=false;
const stars=Array.from({length:50},()=>({x:Math.random()*W,y:Math.random()*H,v:20+Math.random()*60}));
const fmt=v=>v.toFixed(1).replace('.',',');
try{hi=+localStorage.getItem('desvio-hi')||0}catch(e){}
$('hi').textContent=fmt(hi);
function start(){sx=W/2;tx=null;mets=[];pick=null;shield=false;t=0;nextM=.6;nextP=9;flash=0;st='play';$('msg').textContent='';$('sh').textContent='—'}
function tryStart(){if(st!=='play'&&performance.now()-deadAt>500)start()}
function over(){window.Conta&&Conta.submit('desvio',Math.floor(t));st='over';deadAt=performance.now();const rec=t>hi;
 if(rec){hi=Math.round(t*10)/10;try{localStorage.setItem('desvio-hi',hi)}catch(e){}$('hi').textContent=fmt(hi)}
 $('msg').textContent='Você sobreviveu '+fmt(t)+' s'+(rec?' — novo recorde!':'')}
function step(dt){t+=dt;$('sc').textContent=fmt(t);
 const k=(keys.r?1:0)-(keys.l?1:0);
 if(k){sx+=k*420*dt;tx=null}else if(tx!=null){const d=tx-sx;sx+=Math.sign(d)*Math.min(Math.abs(d),1000*dt)}
 sx=Math.max(14,Math.min(W-14,sx));
 nextM-=dt;if(nextM<=0){const r=10+Math.random()*16;
  mets.push({x:Math.random()*W,y:-r,r,vy:(150+Math.min(t,90)*3.5)*(.8+Math.random()*.5),vx:(Math.random()-.5)*60,a:0,w:(Math.random()-.5)*3,sh:Array.from({length:9},()=>.75+Math.random()*.3)});
  nextM=Math.max(.2,.75-t*.011)*(.6+Math.random()*.8)}
 nextP-=dt;if(nextP<=0&&!pick){pick={x:30+Math.random()*(W-60),y:-14};nextP=11+Math.random()*7}
 if(pick){pick.y+=140*dt;if(Math.hypot(pick.x-sx,pick.y-SY)<26){shield=true;$('sh').textContent='ativo';pick=null}else if(pick.y>H+20)pick=null}
 for(let i=mets.length-1;i>=0;i--){const m=mets[i];m.y+=m.vy*dt;m.x+=m.vx*dt;m.a+=m.w*dt;
  if(m.y>H+40){mets.splice(i,1);continue}
  if(Math.hypot(m.x-sx,m.y-SY)<m.r+9){if(shield){shield=false;$('sh').textContent='—';flash=.25;mets.splice(i,1)}else return over()}}}
function draw(dt){x.clearRect(0,0,W,H);x.fillStyle='#46507a';
 stars.forEach(s=>{if(st==='play'){s.y+=s.v*dt;if(s.y>H){s.y=0;s.x=Math.random()*W}}x.fillRect(s.x,s.y,1.5,1.5)});
 mets.forEach(m=>{x.fillStyle='#a8765a';x.strokeStyle='#d9a27e';x.lineWidth=1.5;x.beginPath();
  m.sh.forEach((f,i)=>{const a=m.a+i*TAU/9;x.lineTo(m.x+Math.cos(a)*m.r*f,m.y+Math.sin(a)*m.r*f)});x.closePath();x.fill();x.stroke()});
 if(pick){x.strokeStyle='#7aa2ff';x.lineWidth=3;x.beginPath();x.arc(pick.x,pick.y,11,0,TAU);x.stroke();x.fillStyle='#cfe0ff';x.beginPath();x.arc(pick.x,pick.y,4,0,TAU);x.fill()}
 x.fillStyle='#ffd166';x.beginPath();x.moveTo(sx-5,SY+11);x.lineTo(sx,SY+18+Math.random()*8);x.lineTo(sx+5,SY+11);x.fill();
 x.fillStyle='#6ee7b7';x.beginPath();x.moveTo(sx,SY-15);x.lineTo(sx+13,SY+12);x.lineTo(sx,SY+6);x.lineTo(sx-13,SY+12);x.closePath();x.fill();
 if(shield){x.strokeStyle='rgba(122,162,255,.9)';x.lineWidth=2;x.beginPath();x.arc(sx,SY,22,0,TAU);x.stroke()}
 if(flash>0){flash-=dt;x.fillStyle='rgba(122,162,255,'+Math.max(0,flash)*1.6+')';x.fillRect(0,0,W,H)}
 if(st!=='play'){x.fillStyle='rgba(8,10,16,.62)';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.textAlign='center';x.font='bold 26px system-ui';
  x.fillText(st==='over'?'Fim de jogo':'Desvio',W/2,230);x.font='16px system-ui';x.fillText(st==='over'?fmt(t)+' s · toque para jogar de novo':'Toque para começar',W/2,260)}}
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(st==='play')step(dt);draw(dt);requestAnimationFrame(loop)}
const pos=e=>{const r=cv.getBoundingClientRect();return(e.clientX-r.left)*W/r.width};
cv.addEventListener('pointerdown',e=>{e.preventDefault();drag=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}tryStart();tx=pos(e)});
cv.addEventListener('pointermove',e=>{if(drag||e.pointerType==='mouse')tx=pos(e)});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>drag=false));
const km=e=>({ArrowLeft:'l',ArrowRight:'r',a:'l',d:'r',A:'l',D:'r'})[e.key];
addEventListener('keydown',e=>{const k=km(e);if(k){e.preventDefault();keys[k]=1;tryStart()}else if(e.key===' '||e.key==='Enter'){e.preventDefault();tryStart()}});
addEventListener('keyup',e=>{const k=km(e);if(k)keys[k]=0});
addEventListener('blur',()=>keys={});
$('new').onclick=function(){this.blur();start()};
requestAnimationFrame(loop);
</script><script src="config.js"></script><script src="conta.js"></script><script src="fx.js" defer></script></body></html>
