<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reversi</title><link rel="stylesheet" href="style.css">
<style>.board{grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);gap:2px;background:#0d3b2c;touch-action:manipulation}
.board>div{background:#1f6f54}
.board>div::after{content:'';border-radius:50%;width:0;height:0}
.board>div.b::after,.board>div.w::after{width:80%;height:80%;box-shadow:0 2px 3px rgba(0,0,0,.45)}
.board>div.b::after{background:#14161f}.board>div.w::after{background:#f1f3f8}
.board>div.h::after{width:24%;height:24%;background:rgba(255,255,255,.4)}
.board>div.last{box-shadow:inset 0 0 0 2px var(--warn)}
.board>div.cur{outline:2px solid var(--acc2);outline-offset:-2px;z-index:1}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:4px;border:1px solid var(--mut)}</style></head><body>
<header><a href="index.html">← Jogos</a><h1>⚫ Reversi</h1></header><main>
<div class="bar"><select id="lv"><option value="1">Fácil</option><option value="2" selected>Médio</option><option value="3">Difícil</option><option value="0">2 jogadores</option></select>
<span class="stat"><span class="dot" style="background:#14161f"></span>Pretas <b id="cb">2</b></span><span class="stat"><span class="dot" style="background:#f1f3f8"></span>Brancas <b id="cw">2</b></span>
<button id="new" class="primary">Novo jogo</button></div>
<div class="msg" id="msg"></div><div class="board" id="bd"></div>
<p class="hint">Você joga com as pretas e começa. Cerque peças do adversário em linha para virá-las; os pontinhos mostram as jogadas possíveis. Teclado: setas e Enter.</p>
</main><script>
const $=i=>document.getElementById(i),DR=[-1,-1,-1,0,0,1,1,1],DC=[-1,0,1,-1,1,-1,0,1];
const WT=[100,-20,10,5,5,10,-20,100,-20,-50,-2,-2,-2,-2,-50,-20,10,-2,1,1,1,1,-2,10,5,-2,1,0,0,1,-2,5,5,-2,1,0,0,1,-2,5,10,-2,1,1,1,1,-2,10,-20,-50,-2,-2,-2,-2,-50,-20,100,-20,10,5,5,10,-20,100];
let bd,turn,lv,over,last,note,cur=-1,tok=0;
const els=Array.from({length:64},(_,i)=>{const d=document.createElement('div');d.onclick=()=>{cur=-1;human(i)};$('bd').append(d);return d});
function flips(b,i,p){if(b[i])return[];const r=i>>3,c=i&7,out=[];
 for(let d=0;d<8;d++){let rr=r+DR[d],cc=c+DC[d],n=0;while(rr>=0&&cc>=0&&rr<8&&cc<8&&b[rr*8+cc]===-p){rr+=DR[d];cc+=DC[d];n++}
  if(n&&rr>=0&&cc>=0&&rr<8&&cc<8&&b[rr*8+cc]===p)while(n--){rr-=DR[d];cc-=DC[d];out.push(rr*8+cc)}}return out}
function moves(b,p){const o=[];for(let i=0;i<64;i++){const f=flips(b,i,p);if(f.length)o.push({i,f})}return o}
function play(b,m,p){const n=b.slice();n[m.i]=p;m.f.forEach(j=>n[j]=p);return n}
const count=(b,p)=>b.reduce((s,v)=>s+(v===p),0);
function ev(b,p){let s=0;for(let i=0;i<64;i++)s+=WT[i]*b[i];return s*p+4*(moves(b,p).length-moves(b,-p).length)}
function nega(b,p,d,a,be,passed){if(!d)return ev(b,p);const ms=moves(b,p);
 if(!ms.length)return passed?1e4*(count(b,p)-count(b,-p)):-nega(b,-p,d,-be,-a,true);
 ms.sort((m,n)=>WT[n.i]-WT[m.i]);
 for(const m of ms){const v=-nega(play(b,m,p),-p,d-1,-be,-a,false);if(v>a)a=v;if(a>=be)break}return a}
function pick(ms,p){if(lv===1)return ms[Math.random()*ms.length|0];
 let best=-Infinity,bm=[];for(const m of ms){const v=lv===2?m.f.length+WT[m.i]:-nega(play(bd,m,p),-p,3,-Infinity,Infinity,false);
  if(v>best){best=v;bm=[m]}else if(v===best)bm.push(m)}return bm[Math.random()*bm.length|0]}
const name=p=>lv?(p===1?'Você':'O computador'):(p===1?'Pretas':'Brancas');
function start(){tok++;bd=Array(64).fill(0);bd[27]=bd[36]=-1;bd[28]=bd[35]=1;turn=1;lv=+$('lv').value;over=false;last=-1;note='';cur=-1;render()}
function render(){const ms=over||(lv&&turn===-1)?[]:moves(bd,turn);
 els.forEach((d,i)=>d.className=(bd[i]===1?'b':bd[i]===-1?'w':ms.some(m=>m.i===i)?'h':'')+(i===last?' last':'')+(i===cur?' cur':''));
 const b=count(bd,1),w=count(bd,-1);$('cb').textContent=b;$('cw').textContent=w;
 if(over)$('msg').textContent=b===w?'🤝 Empate, '+b+' × '+w+'!':lv?(b>w?'🎉 Você venceu por '+b+' × '+w+'!':'😵 Você perdeu por '+w+' × '+b+'.'):'🎉 '+(b>w?'Pretas':'Brancas')+' venceram por '+Math.max(b,w)+' × '+Math.min(b,w)+'!';
 else $('msg').textContent=note+(lv?(turn===1?'Sua vez (pretas)':'Computador pensando…'):'Vez das '+(turn===1?'pretas':'brancas'))}
function place(m){bd=play(bd,m,turn);last=m.i;turn=-turn;note='';
 if(!moves(bd,turn).length){if(!moves(bd,-turn).length)over=true;else{note=name(turn)+(lv?' não tem':' não têm')+' jogadas e passa a vez. ';turn=-turn}}
 render();if(!over&&lv&&turn===-1){const k=tok;setTimeout(()=>{if(k===tok)place(pick(moves(bd,-1),-1))},450)}}
function human(i){if(over||(lv&&turn===-1))return;const m=moves(bd,turn).find(q=>q.i===i);if(m)place(m)}
addEventListener('keydown',e=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];
 if(m){e.preventDefault();if(cur<0)cur=27;else cur=Math.max(0,Math.min(7,(cur>>3)+m[1]))*8+Math.max(0,Math.min(7,(cur&7)+m[0]));render()}
 else if((e.key===' '||e.key==='Enter')&&cur>=0&&e.target.tagName!=='SELECT'){e.preventDefault();human(cur)}});
$('new').onclick=function(){this.blur();start()};$('lv').onchange=function(){this.blur();start()};start();
</script></body></html>
