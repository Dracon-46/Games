<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ranking global · Falkyria Games</title><link rel="icon" href="falkyria.svg"><link rel="stylesheet" href="style.css"><script src="icons.js"></script>
<style>
:root{--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;--mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;--amber:#f5b733}
body{background:#0c0c0d;color:#f2efe8}
header{background:#0c0c0d;border-color:#28282b}
main{max-width:860px;align-items:stretch;gap:0;padding-top:34px}
.ttl{font:400 clamp(40px,8vw,72px)/1 var(--serif);letter-spacing:-.02em;margin:0 0 10px}
.sub{color:#8b887f;margin:0 0 26px;max-width:560px}
.tabs{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid #28282b}.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;color:#8b887f;padding:12px 0;white-space:nowrap;margin-bottom:-1px}
.tabs button:hover{color:#f2efe8}.tabs button.on{color:#f2efe8;border-color:var(--amber)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#8b887f;text-align:left;padding:16px 8px 10px;border-bottom:1px solid #28282b}
td{padding:13px 8px;border-bottom:1px solid #1c1c1f}
th:last-child,td:last-child,th.r,td.r{text-align:right}
td.p{width:64px;font:400 22px var(--serif);color:#8b887f}tr.t1 td.p,tr.t2 td.p,tr.t3 td.p{color:var(--amber)}
td.n{font-weight:600}tr.me td{background:#17150f}tr.me td.n::after{content:"você";font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin-left:10px}
tbody tr{animation:rise .45s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i)*28ms)}
.empty{color:#8b887f;padding:48px 8px;border-bottom:1px solid #1c1c1f}
.empty a,.empty button{color:#f2efe8}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){tbody tr{animation:none}}
</style></head><body data-fx="dim">
<header><a class="back" href="index.html"><i data-ic="voltar"></i><span>Jogos</span></a><h1><i data-ic="trofeu"></i> Ranking</h1><a class="brand" href="index.html" title="Falkyria Games"><img src="falkyria.svg" alt="Falkyria"></a></header>
<main>
<h2 class="ttl">Ranking global</h2>
<p class="sub" id="sub">Os melhores jogadores do Falkyria Games. No geral, o 1º lugar de cada jogo vale 100 pontos, o 2º vale 99, e assim por diante.</p>
<div class="tabs" id="tabs"></div>
<table><thead id="th"></thead><tbody id="tb"></tbody></table><div class="empty" id="empty" hidden></div>
<p class="sub" style="margin-top:26px;font-size:14px">O nome de jogador e as pontuações são públicos. Veja a <a href="privacidade.html" style="color:inherit">Política de Privacidade</a> e os <a href="termos.html" style="color:inherit">Termos de Uso</a>.</p>
</main>
<script src="config.js"></script><script src="conta.js"></script><script>
const T=[['geral','Geral'],['xadrez','Xadrez online'],['enxame','Enxame'],['nucleo','Núcleo'],['tunel','Túnel'],['cobrinha','Cobrinha'],['blocos','Blocos'],['tijolos','Quebra-Tijolos'],['orbita','Órbita'],['desvio','Desvio'],['palavras','Chuva de Palavras'],['sequencia','Sequência']];
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur='geral',seq=0;
T.forEach(([k,n])=>{const b=document.createElement('button');b.type='button';b.textContent=n;b.dataset.k=k;b.onclick=()=>show(k,true);$('tabs').append(b)});
function show(k,user){if(!T.some(t=>t[0]===k))k='geral';cur=k;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
 if(user){try{history.replaceState(null,'','#'+k)}catch(e){}}
 const cols=k==='geral'?['Pontos','Jogos']:k==='xadrez'?['Rating','Partidas']:['Pontuação'];
 $('th').innerHTML='<tr><th>Pos.</th><th>Jogador</th>'+cols.map(c=>'<th class="r">'+c+'</th>').join('')+'</tr>';$('tb').innerHTML='';
 const em=$('empty');em.hidden=false;
 if(!Conta.on){em.textContent='O ranking online ainda não foi ativado neste site.';return}
 em.textContent='Carregando…';const my=++seq,me=Conta.user&&Conta.user.name;
 (k==='geral'?Conta.rpc('overall_ranking',{p_limit:50}):k==='xadrez'?Conta.rpc('chess_ranking',{p_limit:50}):Conta.rpc('top_scores',{p_game:k,p_limit:50})).then(rows=>{if(my!==seq)return;
  if(!rows||!rows.length){em.innerHTML='Ninguém pontuou aqui ainda. '+(k==='geral'||k==='xadrez'?'':'<a href="'+k+'.html">Seja o primeiro</a>.');return}em.hidden=true;
  $('tb').innerHTML=rows.map((r,i)=>{const v=k==='geral'?[r.points,r.games]:k==='xadrez'?[r.rating,r.games]:[r.score];
   return'<tr class="t'+r.pos+(r.username===me?' me':'')+'" style="--i:'+Math.min(i,20)+'"><td class="p">'+r.pos+'</td><td class="n">'+esc(r.username)+'</td>'+v.map(x=>'<td class="r">'+Number(x).toLocaleString('pt-BR')+'</td>').join('')+'</tr>'}).join('')},
  e=>{if(my===seq)em.textContent=e.message})}
Conta.onChange(()=>show(cur));addEventListener('hashchange',()=>show(location.hash.slice(1)));show(location.hash.slice(1)||'geral');
</script><script src="fx.js" defer></script></body></html>
