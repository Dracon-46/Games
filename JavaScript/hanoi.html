<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Torre de Hanói</title><link rel="icon" href="falkyria.svg"><link rel="stylesheet" href="style.css"><script src="icons.js"></script>
<style>.pegs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;user-select:none;touch-action:manipulation}
.peg{position:relative;height:250px;background:var(--card);border:2px solid var(--line);border-radius:12px;display:flex;flex-direction:column-reverse;align-items:center;gap:3px;padding:0 5px 12px;cursor:pointer}
.peg::before{content:'';position:absolute;top:44px;bottom:12px;left:50%;width:6px;margin-left:-3px;background:var(--line);border-radius:3px}
.peg::after{content:attr(data-n);position:absolute;top:6px;left:0;right:0;text-align:center;color:var(--mut);font-size:14px}
.peg:hover{border-color:var(--acc2)}.peg.sel{border-color:var(--warn)}
.d{position:relative;height:23px;border-radius:8px;flex:none;transition:transform .1s}
.peg.sel .d:last-child{transform:translateY(-12px);box-shadow:0 0 0 2px var(--warn)}
.msg.bad{color:var(--bad)}</style></head><body data-fx="off">
<header><a class="back" href="index.html"><i data-ic="voltar"></i><span>Jogos</span></a><h1><i data-ic="hanoi"></i> Torre de Hanói</h1><a class="brand" href="index.html" title="Falkyria Games"><img src="falkyria.svg" alt="Falkyria"></a></header><main>
<div class="bar"><select id="n"><option value="3">3 discos</option><option value="4" selected>4 discos</option><option value="5">5 discos</option><option value="6">6 discos</option><option value="7">7 discos</option></select>
<span class="stat">Movimentos <b id="mv">0</b></span><span class="stat">Mínimo <b id="min">15</b></span><button id="new" class="primary">Novo jogo</button></div>
<div class="msg" id="msg"></div>
<div class="pegs"><div class="peg" data-n="1"></div><div class="peg" data-n="2"></div><div class="peg" data-n="3"></div></div>
<p class="hint">Leve todos os discos para a haste 3. Toque na haste de origem e depois na de destino (ou use as teclas 1, 2 e 3). Um disco maior nunca pode ficar sobre um menor.</p>
</main><script>
const $=i=>document.getElementById(i),els=[...document.querySelectorAll('.peg')];
let n,pegs,sel,mv,done;
function say(s,bad){$('msg').textContent=s;$('msg').className='msg'+(bad?' bad':'')}
function start(){n=+$('n').value;pegs=[[],[],[]];for(let k=n;k>=1;k--)pegs[0].push(k);sel=-1;mv=0;done=false;$('min').textContent=2**n-1;say('');draw()}
function draw(){els.forEach((el,i)=>{el.className='peg'+(i===sel?' sel':'');
 el.innerHTML=pegs[i].map(k=>'<div class="d" style="width:'+(22+k*11)+'%;background:hsl('+(k*47+110)+' 65% 62%)"></div>').join('')});$('mv').textContent=mv}
function pick(i){if(done)return;
 if(sel<0){if(pegs[i].length){sel=i;say('')}else say('Essa haste está vazia.',1)}
 else if(sel===i)sel=-1;
 else{const a=pegs[sel],b=pegs[i],k=a[a.length-1];sel=-1;
  if(b.length&&b[b.length-1]<k)say('Movimento inválido: disco maior sobre um menor.',1);
  else{b.push(a.pop());mv++;say('');if(pegs[2].length===n){done=true;const m=2**n-1;say('Resolvido em '+mv+' movimentos'+(mv===m?' — o mínimo possível!':' (mínimo: '+m+').'))}}}
 draw()}
els.forEach((el,i)=>el.onclick=()=>pick(i));
addEventListener('keydown',e=>{if('123'.includes(e.key)&&e.key&&e.target.tagName!=='SELECT'){e.preventDefault();pick(+e.key-1)}});
$('new').onclick=function(){this.blur();start()};$('n').onchange=function(){this.blur();start()};start();
</script><script src="config.js"></script><script src="conta.js"></script><script src="fx.js" defer></script></body></html>
