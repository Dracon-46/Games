<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quatro em Linha</title><link rel="icon" href="falkyria.svg"><link rel="stylesheet" href="style.css">
<style>.board{grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr);aspect-ratio:7/6;width:min(100%,500px);background:#2a3152;border-color:#3d4675;border-radius:14px;touch-action:manipulation}
.board>div::before{content:'';position:absolute;inset:9%;border-radius:50%;background:#0d0f17;box-shadow:inset 0 2px 5px rgba(0,0,0,.7)}
.board>div.cur{background:rgba(255,255,255,.07)}
.disc{position:absolute;inset:9%;border-radius:50%;z-index:1;transition:opacity .4s .5s}
.p1{background:radial-gradient(circle at 35% 30%,#c9fbe6,#6ee7b7 45%,#2a9d78)}
.p2{background:radial-gradient(circle at 35% 30%,#ffc2cc,#ff6b81 45%,#c23a52)}
.drop{animation:drop calc(.2s + var(--r)*.07s) both}
@keyframes drop{0%{transform:translateY(calc((var(--r) + 1)*-122%));animation-timing-function:cubic-bezier(.5,0,1,.7)}72%{transform:none;animation-timing-function:ease-out}86%{transform:translateY(-8%);animation-timing-function:ease-in}100%{transform:none}}
.board.won .disc{opacity:.35}.board.won .win .disc{opacity:1}
.board>div.win::after{content:'';position:absolute;inset:9%;border-radius:50%;z-index:2;box-shadow:0 0 0 3px #fff,0 0 14px 4px var(--warn);animation:ring .5s .55s both}
@keyframes ring{from{opacity:0;transform:scale(1.3)}}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:5px}
.msg.good{color:var(--acc)}.msg.bad{color:var(--bad)}
@media (prefers-reduced-motion:reduce){.drop,.board>div.win::after{animation:none}}</style></head><body>
<header><a class="back" href="index.html"><i data-ic="voltar"></i><span>Jogos</span></a><h1><i data-ic="quatro"></i> Quatro em Linha</h1><a class="brand" href="index.html" title="Falkyria Games"><img src="falkyria.svg" alt="Falkyria"></a></header><main>
<div class="bar"><select id="lv" aria-label="Modo de jogo"><option value="1">Fácil</option><option value="2" selected>Médio</option><option value="3">Difícil</option><option value="0">2 jogadores</option></select>
<span class="stat"><span class="dot p1"></span><span id="n1">Você</span> <b id="w1">0</b></span><span class="stat"><span class="dot p2"></span><span id="n2">Computador</span> <b id="w2">0</b></span>
<button id="new" class="primary">Novo jogo</button></div>
<div class="msg" id="msg"></div><div class="board" id="bd"></div>
<p class="hint">Solte um disco por vez em uma coluna; ele cai até a casa livre mais baixa. Vence quem alinhar quatro discos na horizontal, vertical ou diagonal. Teclado: setas ← → e Enter, ou as teclas 1 a 7.</p>
</main><script>
const $=i=>document.getElementById(i),ORD=[3,2,4,1,5,0,6],SC=[0,1,6,40,0],DEPTH=[0,0,4,8];
const LINES=[];for(let r=0;r<6;r++)for(let c=0;c<7;c++)for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){const er=r+3*dr,ec=c+3*dc;
 if(er<6&&ec>=0&&ec<7)LINES.push([0,1,2,3].map(k=>(r+k*dr)*7+c+k*dc))}
const THRU=Array.from({length:42},(_,i)=>LINES.filter(l=>l.includes(i)));
const ic=n=>'<i data-ic="'+n+'">'+(window.icon?icon(n):'')+'</i> ';
let bd,turn,lv,over,cur=-1,tok=0,cnt,wins=[0,0];
const els=Array.from({length:42},(_,i)=>{const d=document.createElement('div');d.onclick=()=>human(i%7);d.onmouseenter=()=>setCur(i%7);$('bd').append(d);return d});
$('bd').onmouseleave=()=>setCur(-1);
function rowOf(b,c){for(let r=5;r>=0;r--)if(!b[r*7+c])return r;return -1}
function winLine(b,i){const p=b[i];return p?THRU[i].find(l=>b[l[0]]===p&&b[l[1]]===p&&b[l[2]]===p&&b[l[3]]===p):undefined}
function evalB(b,p){let s=0;for(const l of LINES){let a=0,o=0;for(let k=0;k<4;k++){const v=b[l[k]];if(v===p)a++;else if(v)o++}if(!o)s+=SC[a];else if(!a)s-=SC[o]}return s}
function nega(b,p,d,a,be){let any=false;
 for(const c of ORD){const r=rowOf(b,c);if(r<0)continue;any=true;const i=r*7+c;b[i]=p;
  const v=winLine(b,i)?10000+d:d<=1?evalB(b,p):-nega(b,-p,d-1,-be,-a);b[i]=0;if(v>a)a=v;if(a>=be)break}
 return any?a:0}
function best(b,p,d){const cs=ORD.filter(c=>rowOf(b,c)>=0);
 for(const q of[p,-p])for(const c of cs){const i=rowOf(b,c)*7+c;b[i]=q;const w=winLine(b,i);b[i]=0;if(w)return c}
 let bv=-1e9,bm=[];for(const c of cs){const i=rowOf(b,c)*7+c;b[i]=p;const v=d>1?-nega(b,-p,d-1,-1e9,1-bv):evalB(b,p);b[i]=0;
  if(v>bv){bv=v;bm=[c]}else if(v===bv)bm.push(c)}
 return bm[Math.random()*bm.length|0]}
function easy(b,p){const cs=ORD.filter(c=>rowOf(b,c)>=0),hit=q=>cs.find(c=>{const i=rowOf(b,c)*7+c;b[i]=q;const w=winLine(b,i);b[i]=0;return w});
 let c=hit(p);if(c===undefined&&Math.random()<.7)c=hit(-p);return c===undefined?cs[Math.random()*cs.length|0]:c}
const name=p=>lv?(p===1?'Você':'Computador'):(p===1?'Jogador 1':'Jogador 2');
function say(h,cl){$('msg').innerHTML=h;$('msg').className='msg'+(cl?' '+cl:'')}
function status(){$('w1').textContent=wins[0];$('w2').textContent=wins[1];
 if(!over)say(lv?(turn===1?'Sua vez':'Computador pensando…'):'Vez do '+name(turn)+(turn===1?' (verde)':' (vermelho)'))}
function setCur(c){cur=c;els.forEach((d,i)=>d.classList.toggle('cur',i%7===c&&!over))}
function start(){tok++;const m=+$('lv').value;if(m!==lv&&lv!==undefined&&!!m!==!!lv)wins=[0,0];lv=m;bd=Array(42).fill(0);turn=1;over=false;cnt=0;
 $('n1').textContent=name(1);$('n2').textContent=name(-1);$('bd').classList.remove('won');els.forEach(d=>{d.className='';d.innerHTML=''});setCur(-1);status()}
function play(c){const r=rowOf(bd,c);if(over||r<0)return false;const i=r*7+c;bd[i]=turn;cnt++;
 const d=document.createElement('div');d.className='disc drop '+(turn===1?'p1':'p2');d.style.setProperty('--r',r);els[i].append(d);
 const w=winLine(bd,i);
 if(w){over=true;wins[turn===1?0:1]++;w.forEach(j=>els[j].classList.add('win'));$('bd').classList.add('won');setCur(-1);status();
  if(lv)turn===1?say(ic('trofeu')+'Você venceu!','good'):say(ic('caveira')+'O computador venceu.','bad');else say(ic('trofeu')+name(turn)+' venceu!','good')}
 else if(cnt===42){over=true;setCur(-1);say(ic('bandeira')+'Empate: o tabuleiro encheu.')}
 else{turn=-turn;status();if(lv&&turn===-1){const k=tok;setTimeout(()=>{if(k===tok)play(lv===1?easy(bd,-1):best(bd,-1,DEPTH[lv]))},520)}}
 return true}
function human(c){if(over||(lv&&turn===-1))return;play(c)}
addEventListener('keydown',e=>{const t=e.target.tagName;if(t==='SELECT'||e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();setCur(cur<0?3:Math.max(0,Math.min(6,cur+(e.key==='ArrowLeft'?-1:1))))}
 else if((e.key==='Enter'||e.key===' '||e.key==='ArrowDown')&&cur>=0&&t!=='BUTTON'){e.preventDefault();human(cur)}
 else if(e.key>='1'&&e.key<='7'){setCur(+e.key-1);human(cur)}});
$('new').onclick=function(){this.blur();start()};$('lv').onchange=function(){this.blur();start()};start();
</script><script src="icons.js"></script><script src="config.js"></script><script src="conta.js"></script><script src="fx.js" defer></script></body></html>
